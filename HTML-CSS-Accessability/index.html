<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PlantMe — Bring nature into your home with beautiful, low-maintenance plants."
    />
    <title>PlantMe | Home</title>
    <link rel="stylesheet" href="dist/css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header__container">
      <div class="header__container-inner">
        <div class="header__container-top">
          <a href="index.html" class="logo">
            <img src="./src/assets/icons/Logo.svg" alt="PlantMe Logo" />
          </a>

          <!-- Menu -->
          <div class="menu">
            <div class="menu__item">About Us</div>
            <div class="menu-divider">
              <svg fill="none" preserveAspectRatio="none" viewBox="0 0 2 18">
                <path d="M1 0V18" stroke="#111111" />
              </svg>
            </div>
            <div class="menu__item">Contact Us</div>
            <div class="menu-divider">
              <svg fill="none" preserveAspectRatio="none" viewBox="0 0 2 18">
                <path d="M1 0V18" stroke="#111111" />
              </svg>
            </div>
            <div class="menu__item">Blog</div>
            <div class="menu-divider">
              <svg fill="none" preserveAspectRatio="none" viewBox="0 0 2 18">
                <path d="M1 0V18" stroke="#111111" />
              </svg>
            </div>
            <div class="menu__item">Site Map</div>
            <div class="menu-divider">
              <svg fill="none" preserveAspectRatio="none" viewBox="0 0 2 18">
                <path d="M1 0V18" stroke="#111111" />
              </svg>
            </div>
            <!-- Language Selector -->
            <div class="language">
              <div class="menu__item">Eng</div>
              <div class="icon-arrow-down">
                <svg fill="none" preserveAspectRatio="none" viewBox="0 0 24 24">
                  <path
                    d="M17 10L12 15L7 10"
                    stroke="#111111"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.5"
                  />
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Search -->
        <div class="search">
          <div class="search__input">
            <input type="text" placeholder="Search this site" />
          </div>
          <button class="search__button">
            <div class="search__icon">
              <svg fill="none" preserveAspectRatio="none" viewBox="0 0 32 32">
                <path
                  d="M25.5 25.5L21.014 21.006L25.5 25.5ZM23.5 15C23.5 17.2543 22.6045 19.4163 21.0104 21.0104C19.4163 22.6045 17.2543 23.5 15 23.5C12.7457 23.5 10.5837 22.6045 8.98959 21.0104C7.39553 19.4163 6.5 17.2543 6.5 15C6.5 12.7457 7.39553 10.5837 8.98959 8.98959C10.5837 7.39553 12.7457 6.5 15 6.5C17.2543 6.5 19.4163 7.39553 21.0104 8.98959C22.6045 10.5837 23.5 12.7457 23.5 15V15Z"
                  stroke="white"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                />
              </svg>
            </div>
          </button>
        </div>
      </div>
    </header>
  </body>
</html>
